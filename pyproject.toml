[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "circex"
version = "0.1.0"
description = "LLM-based extractor for GCN optical circulars, with regex baseline and MCP server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
authors = [{ name = "Circex contributors" }]

dependencies = [
    "anthropic>=0.40",
    "ollama>=0.6.1",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "httpx>=0.27",
    "tenacity>=9.0",
    "python-dateutil>=2.9",
    "astropy>=6.1",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13.7",
    "sqlite-utils>=3.37",
    "structlog>=24.4",
    "requests>=2.32",
]

[project.optional-dependencies]
# tdtax (skyportal/timedomain-taxonomy) ships a setup.py that fails on Python 3.14
# (uses removed `ast.Constant.s`). Sprint 1 will either patch-install from the
# local clone in `references/timedomain-taxonomy/` or read the YAML directly.
taxonomy = [
    "tdtax>=0.1",
]
plot = [
    "matplotlib>=3.9",
]
# `circex consume --kafka` (live GCN circular stream). Optional: the replay path
# and everything else work without it.
live = [
    "gcn-kafka>=0.3",
]
dev = [
    "matplotlib>=3.9",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.112",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
    "types-requests",
    "types-python-dateutil",
]

[project.scripts]
circex = "circex.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["circex"]

# ---------- Ruff ----------
[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B"]
# Typer idiom: Option/Argument calls in defaults.
"circex/cli.py" = ["B008"]

# ---------- Mypy ----------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
files = ["circex"]

[[tool.mypy.overrides]]
module = ["tdtax.*", "astropy.*", "gcn_kafka.*"]
ignore_missing_imports = true

# ---------- Pytest ----------
[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
    "live: hits real APIs (Anthropic, Ollama, GCN); off by default",
]
asyncio_mode = "auto"
