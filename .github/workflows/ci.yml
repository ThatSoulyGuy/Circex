name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # circex.taxonomy reads YAML files directly from this clone (see README:
      # "Why is tdtax an optional extra"). Five test files + the regex
      # classification matcher depend on this being present.
      - name: Fetch timedomain-taxonomy
        run: git clone --depth 1 https://github.com/skyportal/timedomain-taxonomy references/timedomain-taxonomy

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy circex

      - name: Pytest
        run: pytest --cov=circex --cov-report=term-missing
