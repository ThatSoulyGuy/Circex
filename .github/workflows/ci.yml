name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # circex.taxonomy reads YAML files directly from this clone (see README:
      # "Why is tdtax an optional extra"). Five test files + the regex
      # classification matcher depend on this being present.
      - name: Fetch timedomain-taxonomy
        run: git clone --depth 1 https://github.com/skyportal/timedomain-taxonomy references/timedomain-taxonomy

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Mypy
        run: mypy circex

      - name: Pytest
        run: pytest --cov=circex --cov-report=term-missing

      # The JSON Schema artifacts in schemas/ are generated from the Pydantic
      # models. If a model changes without re-running `circex schema-dump`, the
      # committed artifacts go stale silently — and downstream consumers (ICARE,
      # the upstream gcn-schema PR) pin to them. Re-dump and fail on any diff.
      - name: Schema artifacts up to date
        shell: bash
        run: |
          circex schema-dump --out schemas/
          git diff --exit-code -- schemas/ \
            || (echo "::error::schemas/ is out of date — run 'circex schema-dump --out schemas/' and commit" && exit 1)

      # Downstream consumers pin to the schema version. Any change to a schema
      # artifact must be accompanied by a SCHEMA_VERSION bump (schemas/VERSION),
      # so a consumer comparing versions can detect that the contract changed.
      - name: Schema version bumped on change
        if: runner.os == 'Linux'
        shell: bash
        run: |
          BASE="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            echo "no base ref (new branch / first push) — skipping version-bump check"
            exit 0
          fi
          git fetch --depth=1 origin "$BASE" 2>/dev/null || true
          if git diff --quiet "$BASE" HEAD -- 'schemas/*.schema.json'; then
            echo "no schema-artifact changes — version bump not required"
            exit 0
          fi
          if git diff --quiet "$BASE" HEAD -- 'schemas/VERSION'; then
            echo "::error::schemas/*.schema.json changed but schemas/VERSION did not — bump SCHEMA_VERSION in circex/schema/dump.py and re-dump"
            exit 1
          fi
          echo "schema artifacts changed and VERSION was bumped — OK"

  bridge:
    # Typecheck the TypeScript LeanMCP bridge so a tool added on the Python side
    # but not mirrored here (or a schema/decorator mistake) fails CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: leanmcp_bridge
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install bridge dependencies
        run: npm ci || npm install

      - name: Typecheck bridge
        run: npx tsc --noEmit
